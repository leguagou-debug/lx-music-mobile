name: iOS Build

on:
  push:
    branches: [master, main, ios-support]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    env:
      NO_FLIPPER: 1
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: ios
        run: |
          gem install cocoapods --no-document
          pod install --repo-update

      - name: Build iOS simulator
        working-directory: ios
        run: |
          mkdir -p build-logs
          xcodebuild \
            -workspace LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath DerivedData \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | tee build-logs/xcodebuild.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            ios/build-logs/
            ios/DerivedData/Logs/Build/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload simulator app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LxMusicMobile-simulator
          path: |
            ios/DerivedData/Build/Products/Debug-iphonesimulator/LxMusicMobile.app
          retention-days: 7
